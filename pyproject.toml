[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rag-python"
version = "1.0.0"
description = "A beginner-friendly dependency-free document retrieval project inspired by RAG."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Repository Owner"}
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
